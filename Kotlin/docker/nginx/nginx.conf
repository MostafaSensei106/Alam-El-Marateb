# Edge reverse proxy: terminates TLS + HTTP/2 + HTTP/3 (QUIC),
# proxies to Spring Boot over plain HTTP/1.1 keepalive.
#
# Negotiation model (automatic fallback, no client config needed):
#   H3-capable client  -> QUIC/UDP 443 -> 200 (http/3)
#   H2-capable client  -> TCP 443 ALPN=h2 -> 200 (http/2)
#   Old client         -> TCP 443/80 ALPN=http/1.1 -> 200 (http/1.1)
# The Alt-Svc header below is what tells browsers "retry me over H3".
#
# Requires official nginx image >= 1.25 (compiled with --with-http_v3_module).

user nginx;
worker_processes auto;
worker_rlimit_nofile 8192;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" proto=$server_protocol';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens   off;

    # Compressed API responses (JSON is highly compressible).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/xml text/plain text/css application/javascript;

    # Basic flood protection for auth endpoints.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/s;

    upstream backend {
        server app:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ---- HTTP (port 80): ACME challenge + redirect to HTTPS ----
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS: HTTP/1.1 + H2 (TCP) + H3 (QUIC/UDP) ----
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        # QUIC listeners. UDP 443 must be published (see compose).
        listen 443 quic reuseport;
        listen [::]:443 quic reuseport;

        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # QUIC / 0-RTT helpers.
        quic_retry on;
        ssl_early_data on;
        add_header Early-Data $ssl_early_data always;

        # Advertise HTTP/3. Clients without H3 simply ignore this
        # header and stay on the H2 / HTTP-1.1 connection (ALPN fallback).
        add_header Alt-Svc 'h3=":443"; ma=86400' always;

        # HSTS: after first HTTPS visit, browsers refuse plain-HTTP
        # (kills SSL-stripping downgrade attacks). preload only after
        # you are sure HTTPS serves the whole domain.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # Security headers (tune CSP once Next.js origins are final).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        client_max_body_size 10m;

        # Load-balancer / Docker health probe (no auth, no rate limit).
        location = /healthz {
            access_log off;
            proxy_pass http://backend/actuator/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Tighter rate limit on public write/auth endpoints (login brute-force,
        # analytics spam, callback replay). Everything else pass-through.
        location ~ ^/api/(v1/)?(auth|oauth2|login|analytics/events|shop/checkout/payment-callback) {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
