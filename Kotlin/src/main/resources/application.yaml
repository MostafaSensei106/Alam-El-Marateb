server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: alamelm-arateb-backend

  lifecycle:
    timeout-pre-shutdown-phase 30s

  #Database Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mydatabase}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  # JPA & Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Unknown routes must reach MVC so NoResourceFoundException -> 404 JSON (api-status.md).
  mvc:
    throw-exception-if-no-handler-found: true

  # Database Migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Kafka transport (only used when app.events.transport=kafka)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Phase 2: safe producer — no duplicates on retry, all replicas ack.
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: alamelmateb
      auto-offset-reset: earliest
      max-poll-records: 100
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  # Message bundles (i18n contract: X-Lang header, same shape every language)
  messages:
    basename: messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  # Spring Session backed by Redis (Phase 1: infra ready, API stays JWT stateless).
  # Sessions are only created where explicitly used (admin console later).
  session:
    store-type: ${SESSION_STORE:redis}
    timeout: ${SESSION_TIMEOUT:86400s}

  # OAuth2 / Social Login
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-client-id-placeholder}
            client-secret: ${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
            scope:
              - email
              - profile
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:facebook-client-id-placeholder}
            client-secret: ${FACEBOOK_CLIENT_SECRET:facebook-client-secret-placeholder}
            scope:
              - email
              - public_profile

# JWT Custom Properties
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 Hours
    refresh-expiration-ms: 604800000 # 7 Days
  i18n:
    supported: ar,en
    default: ar
  events:
    transport: ${EVENTS_TRANSPORT:in-process}
  # Transactional outbox (Phase 1): business tx writes outbox_events,
  # OutboxRelay publishes afterwards. Survives broker outages.
  outbox:
    relay-enabled: ${OUTBOX_RELAY_ENABLED:true}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:2000}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:10}
  # Read routing abstraction (Phase 1): both point at primary.
  # Phase 4 only changes REPLICA_URL to a real replica, zero code change.
  datasource:
    replica:
      url: ${REPLICA_URL:${DB_URL:jdbc:postgresql://localhost:5432/mydatabase}}
      username: ${REPLICA_USER:${DB_USER:root}}
      password: ${REPLICA_PASSWORD:${DB_PASSWORD:root}}
  storage:
    dir: ${STORAGE_DIR:./data/uploads}
    max-mb: ${STORAGE_MAX_MB:5}
    backend: ${STORAGE_BACKEND:local}
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:alamelmarateb}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin123}
      public-base: ${S3_PUBLIC_BASE:http://localhost:9000/alamelmarateb}
  # Search backend ('none' or 'meilisearch'). None = Postgres filter.
  search:
    backend: ${SEARCH_BACKEND:none}
    timeout-ms: ${SEARCH_TIMEOUT_MS:2000}
    meili:
      host: ${MEILI_HOST:http://localhost:7700}
      key: ${MEILI_KEY:dev-master-key}
      index: ${MEILI_INDEX:products}
  scheduler:
    enabled: true
  # Partition maintenance + retention windows (Phase 5, daily 03:00).
  retention:
    enabled: ${RETENTION_ENABLED:true}
    cron: ${RETENTION_CRON:0 0 3 * * *}
    app-events-days: ${RETENTION_APP_EVENTS_DAYS:90}
    audit-logs-days: ${RETENTION_AUDIT_LOGS_DAYS:365}
    outbox-published-days: ${RETENTION_OUTBOX_DAYS:30}
    processed-events-days: ${RETENTION_PROCESSED_DAYS:30}
    notifications-sent-days: ${RETENTION_NOTIFICATIONS_DAYS:90}
    precreate-months: ${RETENTION_PRECREATE_MONTHS:3}
  clickhouse:
    enabled: ${CLICKHOUSE_ENABLED:false}
    url: ${CLICKHOUSE_URL:http://localhost:8123}
    user: ${CLICKHOUSE_USER:default}
    password: ${CLICKHOUSE_PASSWORD:}
    database: ${CLICKHOUSE_DB:alamelmarateb}
  payments:
    fake-secret: ${PAYMENTS_FAKE_SECRET:dev-secret}
    paymob:
      enabled: ${PAYMOB_ENABLED:false}
      api-key: ${PAYMOB_API_KEY:}
      hmac-secret: ${PAYMOB_HMAC_SECRET:}
    fawry:
      enabled: ${FAWRY_ENABLED:false}
      merchant-code: ${FAWRY_MERCHANT:}
      secret: ${FAWRY_SECRET:}
  loyalty:
    enabled: true
    earn-per-egp: 10
    egp-per-point: 1
  rate-limit:
    enabled: true
    login-per-minute: 10
    preview-per-minute: 60

# Production Probes & Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# Swagger UI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method