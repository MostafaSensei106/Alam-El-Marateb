<!DOCTYPE html>
<!--
  Static API fallback page. No application data, no external assets,
  no scripts: just the HTTP status and a localized generic message.
-->
<html xmlns:th="http://www.thymeleaf.org" th:lang="${lang}" th:dir="${dir}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="robots" content="noindex, nofollow"/>
    <title th:text="${title}">Error</title>
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f6f6f4;
            --fg: #16181d;
            --muted: #5c6270;
            --line: #d9dbe0;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111317;
                --fg: #f0f1f4;
                --muted: #9aa1ae;
                --line: #2a2e36;
            }
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--bg);
            color: var(--fg);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, "Noto Sans", "Noto Naskh Arabic", sans-serif;
            line-height: 1.6;
        }
        main {
            width: 100%;
            max-width: 460px;
            padding: 32px;
            border: 1px solid var(--line);
            border-radius: 14px;
            text-align: center;
        }
        .code {
            margin: 0 0 8px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.16em;
            color: var(--muted);
        }
        h1 {
            margin: 0 0 12px;
            font-size: 22px;
            font-weight: 650;
        }
        p.message {
            margin: 0;
            font-size: 15px;
            color: var(--muted);
        }
    </style>
</head>
<body>
<main>
    <p class="code" th:text="${code}">500</p>
    <h1 th:text="${title}">Error</h1>
    <p class="message" th:text="${message}">Something went wrong.</p>
</main>
</body>
</html>
