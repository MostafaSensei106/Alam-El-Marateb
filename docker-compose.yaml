services:
  postgres:
    image: postgres:16-alpine
    environment:
      - "POSTGRES_DB=mydatabase"
      - "POSTGRES_PASSWORD=root"
      - "POSTGRES_USER=root"
    ports:
      - "5432:5432"
    # WAL sender settings for the opt-in streaming replica (Phase 4).
    # Harmless without a replica; required before pg_basebackup.
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=5
      -c max_replication_slots=5
      -c hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-initdb:/docker-entrypoint-initdb.d:ro

  # Streaming read replica (Phase 4). Opt-in: docker compose --profile replica up -d.
  # App side: REPLICA_URL=jdbc:postgresql://localhost:5433/mydatabase.
  # Async replication: pure-read @Transactional(readOnly=true) methods route here;
  # writes and read-your-write flows stay on primary by design.
  postgres-replica:
    image: postgres:16-alpine
    container_name: shop-postgres-replica
    profiles: ["replica"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5433:5432"
    environment:
      - "PRIMARY_HOST=postgres"
      - "POSTGRES_USER=root"
      - "POSTGRES_PASSWORD=root"
      - "PGDATA=/var/lib/postgresql/data/pgdata"
    entrypoint: ["/opt/replica-entrypoint.sh"]
    volumes:
      - replica_data:/var/lib/postgresql/data
      - ./docker/postgres-replica/replica-entrypoint.sh:/opt/replica-entrypoint.sh:ro


  redis:
    image: redis:alpine
    container_name: shop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Event transport (future): domain events in core/events keep the same
  # names/shapes when moved to these topics. Opt-in only:
  #   docker compose --profile kafka up -d
  kafka:
    image: apache/kafka:latest
    container_name: shop-kafka
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/var/lib/kafka/data

  # S3-compatible object storage (future): image backend swap target.
  # Opt-in only: docker compose --profile minio up -d (console :9001).
  minio:
    image: minio/minio:latest
    container_name: shop-minio
    profiles: ["minio"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - "MINIO_ROOT_USER=minioadmin"
      - "MINIO_ROOT_PASSWORD=minioadmin123"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Heavy analytics (ClickHouse). Opt-in: docker compose --profile clickhouse up -d (HTTP :8123).
  # App side: CLICKHOUSE_ENABLED=true (+CLICKHOUSE_URL/USER/PASSWORD).
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: shop-clickhouse
    profiles: ["clickhouse"]
    ports:
      - "8123:8123"
      - "9009:9000"
    environment:
      - "CLICKHOUSE_DB=alamelmarateb"
      - "CLICKHOUSE_USER=analytics"
      - "CLICKHOUSE_PASSWORD=analytics123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # Catalog search (Meilisearch, Phase 3). Opt-in: docker compose --profile search up -d (:7700).
  # App side (Phase 3): SEARCH_BACKEND=meilisearch (+MEILI_HOST/MEILI_KEY).
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: shop-search
    profiles: ["search"]
    ports:
      - "7700:7700"
    environment:
      - "MEILI_MASTER_KEY=${MEILI_KEY:-dev-master-key}"
    volumes:
      - meili_data:/meili_data

volumes:
  pgdata:
  replica_data:
  redis_data:
  kafka_data:
  minio_data:
  clickhouse_data:
  meili_data: