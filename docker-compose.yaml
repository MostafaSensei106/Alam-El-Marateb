services:
  postgres:
    image: postgres:16-alpine
    environment:
      - "POSTGRES_DB=mydatabase"
      - "POSTGRES_PASSWORD=root"
      - "POSTGRES_USER=root"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data


  redis:
    image: redis:alpine
    container_name: shop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  pgdata:
  redis_data: