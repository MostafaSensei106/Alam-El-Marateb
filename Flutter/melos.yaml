name: alam_el_marateb
packages:
  - apps/**
  - packages/**

scripts:
  analyze:
    run: dart analyze .
    exec:
      concurrency: 5
  gen:
    run: dart run build_runner build --delete-conflicting-outputs
    exec:
      concurrency: 1
  test:
    run: flutter test
  format:
    run: dart format .
