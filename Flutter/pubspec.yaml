name: alam_el_marateb
publish_to: none
environment:
  sdk: ^3.13.2

workspace:
- apps/staff
- apps/customer
- apps/admin
- packages/core/constants
- packages/core/result
- packages/core/network
- packages/core/services
- packages/core/extensions
- packages/core/utils
- packages/core/di
- packages/core/validators
- packages/core/ui
- packages/core/router
- packages/modules/catalog
- packages/modules/auth
- packages/modules/pos
- packages/modules/inventory
- packages/modules/delivery
- packages/modules/orders
- packages/modules/crm

dev_dependencies:
